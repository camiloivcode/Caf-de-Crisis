<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Café de Crisis · La Guerra del Dólar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%2314100d%27/%3E%3Ctext x=%2750%27 y=%2772%27 font-size=%2762%27 text-anchor=%27middle%27%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* Escala: espresso (casi negro cálido) · crema · caramelo · cereza de café · hoja de cafeto */
:root{--bg:#14100d;--surface:#f7ecd9;--ink:#1c1410;--caramel:#e0a243;--caramel-d:#9a6a1f;--cherry:#c8402f;--leaf:#2c7a58;--shadow:rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Montserrat,system-ui,sans-serif;font-weight:600;color:var(--surface);
  background:radial-gradient(1100px 560px at 50% -12%,rgba(224,162,67,.22),transparent 62%),radial-gradient(800px 500px at 100% 100%,rgba(200,64,47,.12),transparent 60%),var(--bg);
  background-attachment:fixed;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#bg .layer{position:absolute;inset:-40px}
.bean{position:absolute;color:var(--caramel)}
#app{min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,p{margin:0}
.logo{color:var(--caramel);font-weight:900;font-size:clamp(2rem,6vw,3.4rem);text-align:center;text-shadow:0 4px 0 var(--shadow);margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:.25em;flex-wrap:wrap}
.cup{position:relative;display:inline-block}
.steam{position:absolute;left:50%;bottom:92%;width:60%;height:60px;transform:translateX(-50%);display:flex;justify-content:space-between;pointer-events:none}
.steam i{width:6px;height:26px;border-radius:6px;background:linear-gradient(var(--surface),transparent);opacity:0}
.tag{text-align:center;opacity:.85;margin-bottom:22px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}
.card{background:var(--surface);color:var(--ink);border-radius:14px;padding:18px;width:min(400px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 var(--shadow)}
input{font:inherit;font-weight:800;font-size:1.3rem;text-align:center;padding:14px;border:2px solid #cdb893;border-radius:10px;width:100%;text-transform:uppercase;color:var(--ink);background:#fffaf0}
input:focus{outline:3px solid var(--caramel);border-color:var(--caramel)}
.btn{font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer;border:0;border-radius:10px;padding:14px 22px;color:var(--surface);background:var(--ink);box-shadow:0 4px 0 #000;will-change:transform}
.btn:disabled{opacity:.45;cursor:default}
.btn.light{background:var(--caramel);color:var(--ink);box-shadow:0 4px 0 var(--caramel-d)}
.btn:focus-visible,.blk:focus-visible,.link:focus-visible,.tbtn:focus-visible{outline:4px solid var(--surface);outline-offset:3px}
.exit{font-size:.85rem;padding:4px 10px;color:var(--surface)}
.link{background:none;border:0;color:var(--surface);font:inherit;text-decoration:underline;cursor:pointer;opacity:.8;padding:8px}
.err{color:#fff;background:var(--cherry);border-radius:8px;padding:8px 12px;text-align:center;font-size:.95rem}
.teams{display:flex;flex-direction:column;gap:10px;width:min(400px,100%)}
.tbtn{font:inherit;font-weight:800;font-size:1.15rem;text-align:left;padding:16px;border:0;border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--caramel-d);will-change:transform}
.tbtn:disabled{opacity:.4;cursor:default}
.tbtn small{display:block;font-weight:600;opacity:.65}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.08);font-weight:800}
.top .cap{font-size:1.2rem;color:var(--caramel)}
.pill{background:var(--surface);color:var(--ink);border-radius:20px;padding:4px 14px;font-weight:900}
.tm{min-width:2.4em;text-align:center}
.pill.low{background:var(--cherry);color:#fff}

.blks{flex:1;display:grid;gap:12px;padding:12px;grid-template-columns:1fr}
.blk{font:inherit;font-weight:800;text-align:left;color:#fff;border:0;border-radius:14px;padding:16px;display:flex;gap:14px;align-items:flex-start;cursor:pointer;box-shadow:0 5px 0 var(--shadow);font-size:clamp(.95rem,2.6vw,1.15rem);will-change:transform}
.blk .sh{font-size:2.2rem;line-height:1;flex:none;width:2.4rem;text-align:center}
.blk.A{background:var(--cherry)}.blk.B{background:var(--leaf)}.blk.C{background:var(--caramel);color:var(--ink)}
div.blk{cursor:default}
.blk.dim{opacity:.3}
.blk.sel{outline:5px solid var(--surface);outline-offset:2px}
.blk .out{display:block;margin-top:8px;font-weight:600;font-size:.9em;background:rgba(0,0,0,.3);border-radius:8px;padding:8px;color:#fff}
.blk .out b{font-weight:900}
.hint{text-align:center;padding:6px 12px 14px;font-weight:800}

.q{background:var(--surface);color:var(--ink);margin:12px;border-radius:14px;padding:18px;box-shadow:0 5px 0 var(--shadow)}
.q h2{font-weight:900;font-size:clamp(1.2rem,3.2vw,1.9rem);margin-bottom:8px}
.q p{white-space:pre-line;font-size:clamp(.95rem,2.2vw,1.2rem);line-height:1.5}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 16px}
.big-tm{--p:100;position:relative;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;color:var(--ink);font-weight:900;font-size:2rem;background:conic-gradient(var(--ring,var(--caramel)) calc(var(--p)*1%),rgba(255,255,255,.14) 0)}
.big-tm::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--surface)}
.big-tm .tmn{position:relative}
.big-tm.low{--ring:var(--cherry)}
.cnt{text-align:center;font-weight:900;font-size:1.3rem}.cnt small{display:block;font-weight:600;font-size:.8rem;opacity:.8}

.pinbar{background:var(--surface);color:var(--ink);text-align:center;padding:14px;font-weight:800}
.pinbar .n{font-size:clamp(3rem,10vw,6rem);font-weight:900;letter-spacing:.12em;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px 20px;font-weight:800;font-size:1.2rem}
.chip .x{font:inherit;margin-left:10px;background:none;border:0;color:var(--surface);opacity:.6;cursor:pointer;font-size:1rem}
.chip .x:hover{opacity:1}
.trow{max-width:420px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;color:var(--ink);font-weight:800}
.trow .btn{padding:6px 14px;font-size:.9rem}
.chip.off{opacity:.35;border:2px dashed rgba(255,255,255,.4);background:none}

.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.res.big{background:var(--leaf)}.res.small{background:var(--caramel);color:var(--ink)}.res.lose{background:var(--cherry)}.res.none{background:#4a4038}.res.dead{background:#0c0907}
.res h2{font-weight:900;font-size:clamp(2rem,9vw,3.4rem)}
.res .amt{font-weight:900;font-size:2.6rem;background:rgba(0,0,0,.25);border-radius:12px;padding:6px 20px}
.res .why{max-width:520px;background:rgba(0,0,0,.25);border-radius:12px;padding:12px;font-size:.95rem;color:#fff}
.emoji{font-size:4rem}

.rank{display:flex;flex-direction:column;gap:12px;padding:16px;width:min(900px,100%);margin:0 auto}
.rk{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:12px;align-items:center}
.rk .bar{height:48px;background:rgba(255,255,255,.1);border-radius:12px;overflow:hidden;position:relative}
.rk .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--caramel-d),var(--caramel));border-radius:12px}
.rk .bar>span{position:absolute;inset:0;display:flex;align-items:center;padding:0 12px;font-weight:900;color:var(--ink)}
.rk.dead{opacity:.45}
.rk .bar .d{margin-left:auto;background:rgba(255,255,255,.75);border-radius:6px;padding:0 8px}
.d.p{color:#14663f}.d.n{color:#a52a1c}

.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:20px 0;min-height:340px}
.pod>div{width:clamp(90px,26vw,200px);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-weight:800}
.pod .st{width:100%;background:var(--surface);color:var(--ink);border-radius:12px 12px 0 0;font-size:2.4rem;font-weight:900;display:grid;place-items:start center;padding-top:8px}
.pod .p1 .st{background:var(--caramel)}
.pod .dead{opacity:.45}
.conf{position:fixed;left:50%;top:38%;width:10px;height:16px;z-index:5;pointer-events:none;border-radius:2px}
.act{display:flex;gap:12px;justify-content:center;padding:14px;flex-wrap:wrap}

@media(min-width:760px){.blks.host{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="bg"><div class="layer"></div></div>
<div id="app"></div>
<script src="/anime.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const app = $('#app');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const can = () => !RM && typeof anime !== 'undefined';
const M = (n) => '$' + Math.round(n).toLocaleString('es-CO') + ' M';
const SG = (n) => (n >= 0 ? '+' : '−') + '$' + Math.abs(Math.round(n)) + ' M';
const SH = { A: '▲', B: '◆', C: '●' };
const ORD = ['1º', '2º', '3º'];
const KIND = { big: ['¡Gran ganancia!', '🚀'], small: ['Ganancia pequeña', '👍'], lose: ['Pérdida', '📉'], none: ['No decidieron a tiempo', '⏰'] };
const TEAMS = [['andino', 'Café Andino'], ['imperio', 'Café Imperio'], ['titan', 'Café Titán']];

let ses = JSON.parse(localStorage.getItem('ses') || 'null'); // {room, role, team, token}
let st = null, err = '', mode = 'student', pend = null, pinVal = '', hv = 'main', lastKey = '', showTeams = false, renderedAt = 0, lastView = '', lastK = '', endsAt = 0, total = 90000, lastPick = null, arm = false;
const save = () => localStorage.setItem('ses', JSON.stringify(ses));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const exitBtn = () => `<button class="link exit" id="exit">${arm ? '¿Seguro? Toca otra vez para salir' : '⎋ Salir'}</button>`;
// número que se anima al cambiar: k = clave estable, f = formato, from = valor inicial la primera vez
const cnt = (k, v, f = 'M', from) => `<span data-count="${Math.round(v)}" data-k="${k}" data-f="${f}"${from !== undefined ? ` data-from="${Math.round(from)}"` : ''}>${f === 'sg' ? SG(v) : M(v)}</span>`;

async function api(body) {
  const r = await fetch('/api/game', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'Error');
  return j;
}
const fail = (e) => { err = e.message; render(); };
const hostAct = (action) => api({ action, room: ses.room, hostToken: ses.token }).then(poll).catch(fail);

async function poll() {
  if (!ses) return;
  try {
    const q = new URLSearchParams({ room: ses.room, token: ses.token || '', team: ses.team || '' });
    const r = await fetch('/api/game?' + q);
    if (r.status === 404) return leave();
    st = await r.json();
    if (ses.role === 'team' && st.me !== ses.team) { err = 'El docente liberó tu equipo. Vuelve a entrar con el PIN.'; return leave(); }
    endsAt = Date.now() + st.endsIn;
    const k = st.phase + st.round;
    if (k !== lastK) { lastK = k; hv = 'main'; total = st.endsIn || total; }
    render();
  } catch {}
}
function leave() { ses = null; st = null; localStorage.removeItem('ses'); mode = 'student'; pend = null; hv = 'main'; render(); }

/* ---------- vistas ---------- */
const sorted = () => Object.entries(st.teams).filter(([, t]) => t.claimed).sort((a, b) => b[1].cap - a[1].cap);
const lastRes = () => { const h = st.history.at(-1); return h && h.round === st.round ? h.results : {}; };
const logo = (t = 'Café de Crisis') => `<div class="logo"><span class="cup">☕<span class="steam"><i></i><i></i><i></i></span></span><span>${t}</span></div>`;

const blocks = (o) => o.map((x) => {
  const picks = x.kind ? Object.values(st.teams).filter((t) => t.pick === x.letter).map((t) => t.name) : [];
  return `<div class="blk ${x.letter}"><span class="sh">${SH[x.letter]}</span><span>${esc(x.text)}${x.kind ? `<span class="out"><b>${KIND[x.kind][1]} ${KIND[x.kind][0]} ${SG(x.amount)}</b>${picks.length ? ' · ' + picks.map(esc).join(', ') : ''}<br>${esc(x.why)}</span>` : ''}</span></div>`;
}).join('');

function home() {
  if (mode === 'teacher') return `<div class="center">${logo()}<p class="tag">Panel del docente</p>
    <div class="card"><input id="pin" type="password" inputmode="numeric" placeholder="PIN del docente" value="${esc(pinVal)}" aria-label="PIN del docente"><button class="btn" id="mk">Crear partida</button>${err ? `<div class="err">${esc(err)}</div>` : ''}</div>
    <button class="link" id="stu">Volver</button></div>`;
  if (pend) return `<div class="center">${logo()}<p class="tag">Partida <b>${pend.room}</b> · elige tu empresa</p>
    <div class="teams">${TEAMS.map(([k, n]) => `<button class="tbtn" data-t="${k}" ${pend.teams[k].claimed ? 'disabled' : ''}>☕ ${n}<small>${pend.teams[k].claimed ? 'Ya tiene equipo' : 'Disponible'}</small></button>`).join('')}</div>
    ${err ? `<div class="err">${esc(err)}</div>` : ''}<button class="link" id="back">Cambiar PIN</button></div>`;
  return `<div class="center">${logo()}<p class="tag">La guerra del dólar · Simulador de cobertura cambiaria</p>
    <div class="card"><input id="pin" maxlength="4" inputmode="text" autocomplete="off" placeholder="PIN del juego" value="${esc(pinVal)}" aria-label="PIN del juego"><button class="btn" id="go">Entrar</button>${err ? `<div class="err">${esc(err)}</div>` : ''}</div>
    <button class="link" id="tch">¿Eres el docente? Crear partida</button></div>`;
}

function team() {
  if (!st) return '<div class="center"><div class="emoji">☕</div></div>';
  const me = st.teams[ses.team], c = st.current, mine = lastRes()[ses.team];
  const pos = sorted().findIndex(([k]) => k === ses.team);
  const top = `<div class="top"><span>☕ ${esc(me.name)}</span>${exitBtn()}<span>Ronda ${Math.min(st.round + 1, st.total)}/${st.total}</span><span class="cap">${cnt('cap-' + ses.team, me.cap)}</span></div>`;
  if (st.phase === 'lobby') return `<div class="center">${exitBtn()}<div class="emoji">☕</div><h2 class="logo">¡Estás dentro!</h2><p class="tag">${esc(me.name)}<br>Mira la pantalla principal</p></div>`;
  if (me.bankrupt && st.phase !== 'decide') return `<div class="res dead">${exitBtn()}<div class="emoji">💀</div><h2>Tu empresa quebró</h2><p>Sigue la partida en el proyector.</p></div>`;
  if (st.phase === 'decide') {
    if (me.bankrupt) return `<div class="res dead"><div class="emoji">💀</div><h2>Tu empresa quebró</h2>${exitBtn()}</div>`;
    return `${top}<div class="q" style="margin:12px 12px 0"><h2 style="font-size:1.1rem;margin:0">${esc(c.title)}</h2></div>
      <div class="qrow" style="padding:10px 16px"><span class="pill tm"></span><span>${me.pick ? '✔ Decisión enviada' : 'Elige una opción'}</span></div>
      <div class="blks">${c.options.map((o) => `<button class="blk ${o.letter} ${me.pick && me.pick !== o.letter ? 'dim' : ''} ${me.pick === o.letter ? 'sel' : ''}" data-l="${o.letter}"><span class="sh">${SH[o.letter]}</span><span>${esc(o.text)}</span></button>`).join('')}</div>
      <p class="hint">${me.pick ? 'Puedes cambiarla hasta que se acabe el tiempo' : 'Lee la historia en la pantalla principal'}</p>`;
  }
  if (st.phase === 'final') return `<div class="res ${pos === 0 && me.cap > 0 ? 'big' : 'none'}" ${pos === 0 ? 'data-burst' : ''}><div class="emoji">${pos === 0 ? '🏆' : pos === 1 ? '🥈' : '🥉'}</div><h2>${ORD[pos]} lugar</h2><div class="amt">${cnt('cap-' + ses.team, me.cap)}</div><p>${esc(me.name)}</p>${exitBtn()}</div>`;
  const k = mine?.kind || 'none';
  return `<div class="res ${k}"><div class="emoji">${KIND[k][1]}</div><h2>${KIND[k][0]}</h2>${mine ? `<div class="amt">${cnt('amt-' + st.round, mine.amount, 'sg', 0)}</div>` : ''}
    <p>Capital: <b>${cnt('cap-' + ses.team, me.cap)}</b> · Van <b>${ORD[pos]}</b></p>${c ? `<div class="why">${esc(c.options.find((o) => o.letter === mine?.letter)?.why || c.options.find((o) => o.kind === 'lose').why)}</div>` : ''}
    <p class="hint">Esperando la siguiente ronda…</p>${exitBtn()}</div>`;
}

function rankHtml() {
  const top = Math.max(1000, ...Object.values(st.teams).map((t) => t.cap));
  const res = lastRes();
  return `<div class="rank">${sorted().map(([k, t]) => `<div class="rk ${t.bankrupt ? 'dead' : ''}"><b>☕ ${esc(t.name)}${t.bankrupt ? ' 💀' : ''}</b>
    <div class="bar"><i data-w="${Math.max(0, t.cap) / top * 100}" data-k="${k}"></i><span>${cnt('cap-' + k, t.cap, 'M', res[k] ? t.cap - res[k].amount : undefined)}${res[k] ? `<span class="d ${res[k].amount >= 0 ? 'p' : 'n'}">${SG(res[k].amount)}</span>` : ''}</span></div></div>`).join('')}</div>`;
}

function podium() {
  const s = sorted(), order = [1, 0, 2].filter((i) => s[i]), H = [220, 150, 100];
  return `<div class="center" data-burst><h2 class="logo">${s[0][1].cap > 0 ? '🏆 ' + esc(s[0][1].name) : '💀 Nadie sobrevivió'}</h2>
    <div class="pod">${order.map((i) => `<div class="p${i + 1} ${s[i][1].bankrupt ? 'dead' : ''}"><span class="nm">${esc(s[i][1].name)}<br>${M(s[i][1].cap)}</span><div class="st" data-h="${H[i]}" style="height:${H[i]}px">${i + 1}</div></div>`).join('')}</div>
    <button class="btn light" id="new">Nueva partida</button></div>`;
}

function host() {
  if (!st) return '<div class="center"><div class="emoji">☕</div></div>';
  const c = st.current, alive = Object.values(st.teams).filter((t) => !t.bankrupt && t.claimed);
  if (st.phase === 'lobby') {
    const n = Object.values(st.teams).filter((t) => t.claimed).length;
    return `<div class="pinbar">Entra a <b>${esc(location.host)}</b> con el PIN<div class="n">${esc(ses.room)}</div></div>
      <div class="center">${exitBtn()}<div class="chips">${TEAMS.map(([k, name]) => `<div class="chip ${st.teams[k].claimed ? '' : 'off'}" data-k="${k}">☕ ${name}${st.teams[k].claimed ? `<button class="x" data-rel="${k}" title="Liberar equipo" aria-label="Liberar ${name}">✕</button>` : ''}</div>`).join('')}</div>
      <p class="tag">${n}/3 equipos conectados</p><button class="btn light" data-h="start" ${n ? '' : 'disabled'}>Comenzar</button>${err ? `<div class="err">${esc(err)}</div>` : ''}</div>`;
  }
  const head = `<div class="top"><span>PIN <b>${esc(ses.room)}</b></span><span>Ronda ${st.round + 1}/${st.total}</span><span><button class="link exit" id="tg">👥 Equipos</button>${exitBtn()}</span></div>${!showTeams ? '' : `<div class="q"><h3>Equipos</h3>${TEAMS.map(([k, n]) => `<div class="trow"><span>☕ ${n} · ${st.teams[k].claimed ? 'conectado' : 'libre'}</span>${st.teams[k].claimed ? `<button class="btn" data-rel="${k}">Liberar</button>` : ''}</div>`).join('')}<p style="font-size:.85rem;opacity:.7">Liberar deja que otro dispositivo tome ese equipo; conserva su capital y su decisión.</p></div>`}`;
  if (st.phase === 'decide') {
    const done = alive.filter((t) => t.decided).length;
    return `${head}<div class="q"><h2>${esc(c.title)}</h2><p>${esc(c.story)}</p></div>
      <div class="qrow"><div class="big-tm tm"><b class="tmn"></b></div><div class="cnt">${cnt('done', done, 'n')}/${alive.length}<small>decisiones</small></div><button class="btn light" data-h="reveal">Revelar ya</button></div>
      <div class="blks host">${blocks(c.options.map((o) => ({ letter: o.letter, text: o.text })))}</div>`;
  }
  if (hv === 'podium') return podium();
  const final = st.phase === 'final';
  if (hv === 'rank') return `${head}<h2 class="logo" style="margin-top:14px">Ranking</h2>${rankHtml()}<div class="act"><button class="btn light" data-h="next">Siguiente ronda →</button></div>`;
  return `${head}<div class="q"><h2>${esc(c.title)}: resultados</h2></div><div class="blks host">${blocks(c.options)}</div>
    <div class="act"><button class="btn light" id="adv">${final ? 'Ver podio 🏆' : 'Ver ranking'}</button></div>`;
}

/* ---------- animación (anime.js) ---------- */
const prevV = {};
const fmt = (f, v) => (f === 'sg' ? SG(v) : f === 'n' ? String(Math.round(v)) : M(v));

function animateValues() {
  document.querySelectorAll('[data-count]').forEach((el) => {
    const to = +el.dataset.count, k = el.dataset.k, f = el.dataset.f || 'M';
    const from = k in prevV ? prevV[k] : el.dataset.from !== undefined ? +el.dataset.from : to;
    prevV[k] = to;
    el.textContent = fmt(f, from);
    if (from === to || !can()) return void (el.textContent = fmt(f, to));
    const o = { v: from };
    anime({ targets: o, v: to, duration: 1200, easing: 'easeOutExpo', update: () => { el.textContent = fmt(f, o.v); }, complete: () => { el.textContent = fmt(f, to); } });
  });
  document.querySelectorAll('[data-w]').forEach((el) => {
    const k = 'w' + el.dataset.k, to = +el.dataset.w, from = k in prevV ? prevV[k] : 0;
    prevV[k] = to;
    if (!can() || from === to) return void (el.style.width = to + '%');
    el.style.width = from + '%';
    anime({ targets: el, width: [from + '%', to + '%'], duration: 1100, easing: 'easeOutQuart' });
  });
}

const rise = (sel, base = 0, extra = {}) => {
  const n = document.querySelectorAll(sel);
  if (n.length) anime({ targets: n, opacity: [0, 1], translateY: [26, 0], scale: [.94, 1], delay: anime.stagger(90, { start: base }), duration: 800, easing: 'easeOutElastic(1,.8)', ...extra });
};

function enter() {
  if (!can()) return;
  rise('.pinbar,.top', 0, { translateY: [-30, 0], scale: [1, 1] });
  rise('.logo', 0, { translateY: [-30, 0] });
  rise('.tag', 120);
  rise('.center>.card,.teams .tbtn', 200);
  rise('.q', 0, { translateY: [-24, 0] });
  rise('.chip', 150);
  rise('.blk', 250);
  rise('.rk', 150, { translateY: [0, 0], translateX: [-40, 0], scale: [1, 1] });
  rise('.act .btn,.center>.btn', 500);
  if ($('.res')) {
    anime({ targets: '.res', clipPath: ['circle(0% at 50% 45%)', 'circle(150% at 50% 45%)'], duration: 750, easing: 'easeOutQuad' });
    anime({ targets: '.res .emoji', scale: [0, 1], rotate: [-40, 0], duration: 1100, delay: 250, easing: 'easeOutElastic(1,.55)' });
    rise('.res h2', 350, { scale: [.8, 1] });
    rise('.res .amt,.res>p,.res .why,.res .hint', 500, { translateY: [18, 0] });
  }
  if ($('.pod')) {
    anime({ targets: '.pod .st', height: (el) => [0, el.dataset.h + 'px'], delay: (el) => [600, 0, 1200][+el.parentNode.className.match(/p(\d)/)[1] - 1] ?? 0, duration: 900, easing: 'easeOutBack' });
    anime({ targets: '.pod .nm', opacity: [0, 1], translateY: [20, 0], delay: 1500, duration: 600, easing: 'easeOutQuad' });
  }
  if ($('[data-burst]')) setTimeout(burst, 1300);
}

function burst() {
  if (!can()) return;
  const cols = ['#c8402f', '#2c7a58', '#e0a243', '#f7ecd9', '#9a6a1f'];
  const els = Array.from({ length: 80 }, (_, i) => {
    const d = document.createElement('i');
    d.className = 'conf'; d.style.background = cols[i % cols.length];
    document.body.appendChild(d); return d;
  });
  anime({
    targets: els,
    translateX: () => anime.random(-420, 420),
    translateY: [{ value: () => anime.random(-420, -120), duration: 700, easing: 'easeOutQuad' }, { value: () => window.innerHeight, duration: 1800, easing: 'easeInQuad' }],
    rotate: () => anime.random(-720, 720),
    opacity: [{ value: 1, duration: 1800 }, { value: 0, duration: 700 }],
    delay: anime.stagger(12),
    duration: 2500,
    complete: () => els.forEach((e) => e.remove()),
  });
}

function ambient() {
  const layer = $('#bg .layer');
  if (!can()) return;
  for (let i = 0; i < 14; i++) {
    const s = anime.random(22, 54), d = document.createElement('div');
    d.className = 'bean';
    d.style.cssText = `left:${anime.random(0, 96)}%;top:${anime.random(0, 94)}%;width:${s}px;opacity:${(anime.random(5, 13) / 100).toFixed(2)}`;
    d.innerHTML = '<svg viewBox="0 0 40 56" width="100%"><ellipse cx="20" cy="28" rx="17" ry="25" fill="currentColor"/><path d="M20 4C9 20 31 36 20 52" stroke="#14100d" fill="none" stroke-width="3.5"/></svg>';
    layer.appendChild(d);
    anime({ targets: d, translateY: () => anime.random(-40, 40), translateX: () => anime.random(-25, 25), rotate: () => anime.random(-40, 40), duration: anime.random(6000, 11000), direction: 'alternate', loop: true, easing: 'easeInOutSine' });
  }
  let t = 0;
  addEventListener('pointermove', (e) => {
    if (Date.now() - t < 120) return; t = Date.now();
    anime({ targets: layer, translateX: (e.clientX / innerWidth - .5) * -40, translateY: (e.clientY / innerHeight - .5) * -40, duration: 900, easing: 'easeOutQuad' });
  });
}

function loops() {
  if (!can()) return;
  const w = document.querySelectorAll('.steam i');
  if (w.length) anime({ targets: w, translateY: [0, -46], scaleX: [1, 1.8], opacity: [{ value: .55, duration: 600 }, { value: 0, duration: 1200 }], delay: anime.stagger(450), duration: 1800, loop: true, easing: 'easeOutSine' });
}

// interacción: hover / presionar en botones y bloques
const BTN = 'button.blk,button.tbtn,.btn';
const to = (b, s, y = 0, d = 220) => { anime.remove(b); anime({ targets: b, scale: s, translateY: y, duration: d, easing: s === 1 ? 'easeOutElastic(1,.6)' : 'easeOutQuad' }); };
addEventListener('pointerover', (e) => { const b = can() && e.target.closest?.(BTN); if (b && !b.disabled && e.pointerType === 'mouse' && !b.contains(e.relatedTarget)) to(b, 1.03, -3); });
addEventListener('pointerout', (e) => { const b = can() && e.target.closest?.(BTN); if (b && !b.disabled && !b.contains(e.relatedTarget)) to(b, 1); });
addEventListener('pointerdown', (e) => { const b = can() && e.target.closest?.(BTN); if (b && !b.disabled) to(b, .95, 2, 90); });
addEventListener('pointerup', (e) => { const b = can() && e.target.closest?.(BTN); if (b && !b.disabled) to(b, 1.02, -2, 300); });

/* ---------- render ---------- */
function render() {
  const html = !ses ? home() : ses.role === 'host' ? host() : team();
  if (html === lastKey) return;
  lastKey = html;
  renderedAt = Date.now();
  if (can()) anime.running.slice().forEach((a) => { if (a.animatables.some((x) => x.target instanceof Node && app.contains(x.target))) a.pause(); });
  const view = ses ? ses.role + (st ? st.phase + st.round + hv : '') : mode + (pend ? 'p' : '');
  const entering = view !== lastView; lastView = view;
  app.innerHTML = html;
  bind();
  tick();
  animateValues();
  loops();
  if (entering) enter();
  const sel = $('.blk.sel');
  const pick = sel ? sel.dataset.l : null;
  if (pick && pick !== lastPick && can() && !entering) anime({ targets: sel, scale: [1, 1.06, 1], duration: 450, easing: 'easeOutQuad' });
  lastPick = st?.phase === 'decide' ? pick : null;
}

function tick() {
  if (!st || st.phase !== 'decide') return;
  const left = Math.max(0, endsAt - Date.now()), s = Math.ceil(left / 1000);
  document.querySelectorAll('.tm').forEach((e) => {
    (e.querySelector('.tmn') || e).textContent = s;
    e.style.setProperty('--p', Math.min(100, left / total * 100));
    const low = s <= 10;
    e.classList.toggle('low', low);
    if (low && !e.dataset.pulse && can()) { e.dataset.pulse = 1; anime({ targets: e, scale: [1, 1.14], direction: 'alternate', loop: true, duration: 420, easing: 'easeInOutSine' }); }
  });
}
setInterval(tick, 250);

function bind() {
  const pin = $('#pin');
  pin?.addEventListener('input', () => { pinVal = pin.value; });
  pin?.addEventListener('keydown', (e) => { if (e.key === 'Enter') ($('#go') || $('#mk')).click(); });
  $('#tch')?.addEventListener('click', () => { mode = 'teacher'; pinVal = ''; err = ''; render(); });
  $('#stu')?.addEventListener('click', () => { mode = 'student'; pinVal = ''; err = ''; render(); });
  $('#back')?.addEventListener('click', () => { pend = null; err = ''; render(); });
  $('#mk')?.addEventListener('click', async () => {
    try { const j = await api({ action: 'create', pin: pinVal }); ses = { room: j.room, role: 'host', token: j.hostToken }; err = ''; pinVal = ''; save(); poll(); } catch (e) { fail(e); }
  });
  $('#go')?.addEventListener('click', async () => {
    const room = pinVal.trim().toUpperCase();
    try {
      const r = await fetch('/api/game?room=' + encodeURIComponent(room));
      if (!r.ok) throw new Error('No encontramos esa partida. Revisa el PIN.');
      pend = { room, teams: (await r.json()).teams }; err = ''; render();
    } catch (e) { fail(e); }
  });
  document.querySelectorAll('[data-t]').forEach((b) => b.addEventListener('click', async () => {
    try {
      const j = await api({ action: 'join', room: pend.room, team: b.dataset.t });
      ses = { room: pend.room, role: 'team', team: b.dataset.t, token: j.token }; pend = null; err = ''; save(); poll();
    } catch (e) { fail(e); }
  }));
  document.querySelectorAll('[data-h]').forEach((b) => b.addEventListener('click', () => { if (b.dataset.h === 'next' && Date.now() - renderedAt < 700) return; hostAct(b.dataset.h); })); // evita saltar el ranking con doble clic
  document.querySelectorAll('.blk[data-l]').forEach((b) => b.addEventListener('click', async () => {
    try { await api({ action: 'choose', room: ses.room, team: ses.team, token: ses.token, letter: b.dataset.l }); err = ''; poll(); } catch (e) { fail(e); }
  }));
  $('#tg')?.addEventListener('click', () => { showTeams = !showTeams; render(); });
  document.querySelectorAll('[data-rel]').forEach((b) => b.addEventListener('click', () => {
    api({ action: 'release', room: ses.room, hostToken: ses.token, team: b.dataset.rel }).then(poll).catch(fail);
  }));
  $('#adv')?.addEventListener('click', () => { hv = st.phase === 'final' ? 'podium' : 'rank'; render(); });
  $('#new')?.addEventListener('click', leave);
  $('#exit')?.addEventListener('click', () => {
    if (arm) { arm = false; return leave(); }
    arm = true; render(); setTimeout(() => { arm = false; render(); }, 3500);
  });
}

ambient();
render();
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
