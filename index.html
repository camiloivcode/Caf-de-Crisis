<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Café de Crisis · La Guerra del Dólar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%232b1810%27/%3E%3Ctext x=%2750%27 y=%2772%27 font-size=%2762%27 text-anchor=%27middle%27%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#2b1810;--red:#b8412e;--blue:#2f6f8f;--yel:#d99a28;--grn:#3f7d3a;--ink:#2b1810;--cream:#fff3dc;--gold:#f3b84b;--shadow:rgba(0,0,0,.32)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Montserrat,system-ui,sans-serif;font-weight:600;color:#fff;background:var(--bg);overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;background:rgba(243,184,75,.07)}
body::before{width:60vmax;height:60vmax;left:-20vmax;top:-25vmax}
body::after{width:50vmax;height:50vmax;right:-18vmax;bottom:-22vmax}
#app{min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,p{margin:0}
.logo{color:var(--gold);font-weight:900;font-size:clamp(2rem,6vw,3.4rem);text-align:center;text-shadow:0 4px 0 var(--shadow);margin-bottom:6px}
.tag{text-align:center;opacity:.85;margin-bottom:22px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}
.card{background:var(--cream);color:var(--ink);border-radius:10px;padding:18px;width:min(400px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 var(--shadow)}
input{font:inherit;font-weight:800;font-size:1.3rem;text-align:center;padding:14px;border:2px solid #bbb;border-radius:6px;width:100%;text-transform:uppercase;color:var(--ink)}
input:focus{outline:3px solid var(--blue);border-color:var(--blue)}
.btn{font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer;border:0;border-radius:6px;padding:14px 22px;color:var(--cream);background:var(--ink);box-shadow:0 4px 0 #000;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 #000}
.btn:disabled{opacity:.45;cursor:default}
.btn.light{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #8a5d10}
.btn:focus-visible,.blk:focus-visible,.link:focus-visible{outline:4px solid #fff;outline-offset:3px}
.exit{font-size:.85rem;padding:4px 10px;color:var(--cream)}
.link{background:none;border:0;color:#fff;font:inherit;text-decoration:underline;cursor:pointer;opacity:.85;padding:8px}
.err{color:#fff;background:var(--red);border-radius:6px;padding:8px 12px;text-align:center;font-size:.95rem}
.teams{display:flex;flex-direction:column;gap:10px;width:min(400px,100%)}
.tbtn{font:inherit;font-weight:800;font-size:1.15rem;text-align:left;padding:16px;border:0;border-radius:8px;background:var(--cream);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 #aaa}
.tbtn:disabled{opacity:.4;cursor:default}
.tbtn small{display:block;font-weight:600;opacity:.65}

/* barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:rgba(0,0,0,.25);font-weight:800}
.top .cap{font-size:1.2rem}
.pill{background:var(--cream);color:var(--ink);border-radius:20px;padding:4px 14px;font-weight:900}
.tm{min-width:2.4em;text-align:center}
.tm.low{background:var(--red);color:#fff;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}

/* bloques de respuesta */
.blks{flex:1;display:grid;gap:12px;padding:12px;grid-template-columns:1fr}
.blk{font:inherit;font-weight:800;text-align:left;color:#fff;border:0;border-radius:8px;padding:16px;display:flex;gap:14px;align-items:flex-start;cursor:pointer;box-shadow:0 5px 0 var(--shadow);font-size:clamp(.95rem,2.6vw,1.15rem);animation:pop .35s both}
.blk:nth-child(2){animation-delay:.08s}.blk:nth-child(3){animation-delay:.16s}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}}
.blk .sh{font-size:2.2rem;line-height:1;flex:none;width:2.4rem;text-align:center}
.blk.A{background:var(--red)}.blk.B{background:var(--blue)}.blk.C{background:var(--yel)}
.blk:disabled{cursor:default}
.blk.dim{opacity:.3}
.blk.sel{outline:5px solid #fff;outline-offset:2px}
.blk .out{display:block;margin-top:8px;font-weight:600;font-size:.9em;background:rgba(0,0,0,.28);border-radius:6px;padding:8px}
.blk .out b{font-weight:900}
.hint{text-align:center;padding:6px 12px 14px;font-weight:800}

/* pregunta */
.q{background:var(--cream);color:var(--ink);margin:12px;border-radius:10px;padding:18px;box-shadow:0 5px 0 var(--shadow)}
.q h2{font-weight:900;font-size:clamp(1.2rem,3.2vw,1.9rem);margin-bottom:8px}
.q p{white-space:pre-line;font-size:clamp(.95rem,2.2vw,1.2rem);line-height:1.5}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 16px}
.big-tm{width:84px;height:84px;border-radius:50%;background:var(--cream);color:var(--ink);display:grid;place-items:center;font-weight:900;font-size:2rem;box-shadow:0 4px 0 var(--shadow)}
.big-tm.low{background:var(--red);color:#fff;animation:pulse .5s infinite alternate}
.cnt{text-align:center;font-weight:900;font-size:1.3rem}.cnt small{display:block;font-weight:600;font-size:.8rem;opacity:.8}

/* lobby docente */
.pinbar{background:var(--cream);color:var(--ink);text-align:center;padding:14px;font-weight:800}
.pinbar .n{font-size:clamp(3rem,10vw,6rem);font-weight:900;letter-spacing:.12em;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.chip{background:rgba(0,0,0,.3);border-radius:8px;padding:12px 20px;font-weight:800;font-size:1.2rem;animation:pop .35s both}
.chip.off{opacity:.35;border:2px dashed #fff8;background:none}

/* resultado equipo */
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.res.big{background:var(--grn)}.res.small{background:var(--yel)}.res.lose{background:var(--red)}.res.none{background:#555}.res.dead{background:#120a06}
.res h2{font-weight:900;font-size:clamp(2rem,9vw,3.4rem);animation:pop .4s both}
.res .amt{font-weight:900;font-size:2.6rem;background:rgba(0,0,0,.25);border-radius:8px;padding:6px 20px}
.res .why{max-width:520px;background:rgba(0,0,0,.25);border-radius:8px;padding:12px;font-size:.95rem}
.emoji{font-size:4rem}
.wait{animation:bob 1.2s infinite alternate ease-in-out}
@keyframes bob{to{transform:translateY(-12px)}}

/* ranking */
.rank{display:flex;flex-direction:column;gap:12px;padding:16px;width:min(900px,100%);margin:0 auto}
.rk{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:12px;align-items:center}
.rk .bar{height:46px;background:rgba(0,0,0,.3);border-radius:8px;overflow:hidden;position:relative}
.rk .bar i{display:block;height:100%;background:var(--gold);border-radius:8px;transition:width 1s}
.rk .bar>span{position:absolute;inset:0;display:flex;align-items:center;padding:0 12px;font-weight:900;color:var(--ink);mix-blend-mode:normal}
.rk.dead{opacity:.45}
.d.p{color:#8cff7a}.d.n{color:#ffb0b0}
.rk .bar .d{margin-left:auto;color:var(--ink);background:rgba(255,255,255,.7);border-radius:4px;padding:0 6px}

/* podio */
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:20px 0;min-height:340px}
.pod div{width:clamp(90px,26vw,200px);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-weight:800}
.pod .st{width:100%;background:var(--cream);color:var(--ink);border-radius:8px 8px 0 0;font-size:2.4rem;font-weight:900;display:grid;place-items:start center;padding-top:8px;animation:rise 1s both}
.pod .p1 .st{height:220px;animation-delay:1.2s;background:var(--gold)}.pod .p2 .st{height:150px;animation-delay:.6s}.pod .p3 .st{height:100px}
@keyframes rise{from{height:0}}
.pod .dead{opacity:.45}
.conf{position:fixed;top:-20px;width:10px;height:16px;z-index:5;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.act{display:flex;gap:12px;justify-content:center;padding:14px;flex-wrap:wrap}

@media(min-width:760px){.blks.host{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = (s) => document.querySelector(s);
const app = $('#app');
const M = (n) => '$' + Math.round(n).toLocaleString('es-CO') + ' M';
const SG = (n) => (n >= 0 ? '+' : '−') + '$' + Math.abs(n) + ' M';
const SH = { A: '▲', B: '◆', C: '●' };
const ORD = ['1º', '2º', '3º'];
const KIND = { big: ['¡Gran ganancia!', '🚀'], small: ['Ganancia pequeña', '👍'], lose: ['Pérdida', '📉'], none: ['No decidieron a tiempo', '⏰'] };
const TEAMS = [['andino', 'Café Andino'], ['imperio', 'Café Imperio'], ['titan', 'Café Titán']];

let ses = JSON.parse(localStorage.getItem('ses') || 'null'); // {room, role, team, token}
let st = null, err = '', mode = 'student', pend = null, pinVal = '', hv = 'main', lastKey = '', endsAt = 0, confetti = false;
const save = () => localStorage.setItem('ses', JSON.stringify(ses));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function api(body) {
  const r = await fetch('/api/game', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'Error');
  return j;
}
const fail = (e) => { err = e.message; render(); };
let arm = false;
const exitBtn = () => `<button class="link exit" id="exit">${arm ? '¿Seguro? Toca otra vez para salir' : '⎋ Salir'}</button>`;
const hostAct = (action) => api({ action, room: ses.room, hostToken: ses.token }).then(poll).catch(fail);

async function poll() {
  if (!ses) return;
  try {
    const q = new URLSearchParams({ room: ses.room, token: ses.token || '', team: ses.team || '' });
    const r = await fetch('/api/game?' + q);
    if (r.status === 404) return leave();
    st = await r.json();
    endsAt = Date.now() + st.endsIn;
    const k = st.phase + st.round;
    if (k !== lastK) { lastK = k; hv = 'main'; if (st.phase === 'final') confetti = true; }
    render();
  } catch {}
}
let lastK = '';
function leave() { ses = null; st = null; localStorage.removeItem('ses'); mode = 'student'; pend = null; render(); }

/* ---------- helpers de vista ---------- */
const sorted = () => Object.entries(st.teams).filter(([, t]) => t.claimed).sort((a, b) => b[1].cap - a[1].cap);
const lastRes = () => { const h = st.history.at(-1); return h && h.round === st.round ? h.results : {}; };
const blocks = (o) => o.map((x) => {
  const picks = x.kind ? Object.values(st.teams).filter((t) => t.pick === x.letter).map((t) => t.name) : [];
  return `<div class="blk ${x.letter}" style="cursor:default"><span class="sh">${SH[x.letter]}</span><span>${esc(x.text)}${x.kind ? `<span class="out"><b>${KIND[x.kind][1]} ${KIND[x.kind][0]} ${SG(x.amount)}</b>${picks.length ? ' · ' + picks.map(esc).join(', ') : ''}<br>${esc(x.why)}</span>` : ''}</span></div>`;
}).join('');

/* ---------- entrada ---------- */
function home() {
  if (mode === 'teacher') return `<div class="center"><div class="logo">☕ Café de Crisis</div><p class="tag">Panel del docente</p>
    <div class="card"><input id="pin" type="password" inputmode="numeric" placeholder="PIN del docente" value="${esc(pinVal)}" aria-label="PIN del docente"><button class="btn" id="mk">Crear partida</button>${err ? `<div class="err">${esc(err)}</div>` : ''}</div>
    <button class="link" id="stu">Volver</button></div>`;
  if (pend) return `<div class="center"><div class="logo">☕ Café de Crisis</div><p class="tag">Partida <b>${pend.room}</b> · elige tu empresa</p>
    <div class="teams">${TEAMS.map(([k, n]) => `<button class="tbtn" data-t="${k}" ${pend.teams[k].claimed ? 'disabled' : ''}>☕ ${n}<small>${pend.teams[k].claimed ? 'Ya tiene equipo' : 'Disponible'}</small></button>`).join('')}</div>
    ${err ? `<div class="err">${esc(err)}</div>` : ''}<button class="link" id="back">Cambiar PIN</button></div>`;
  return `<div class="center"><div class="logo">☕ Café de Crisis</div><p class="tag">La guerra del dólar · Simulador de cobertura cambiaria</p>
    <div class="card"><input id="pin" maxlength="4" inputmode="text" autocomplete="off" placeholder="PIN del juego" value="${esc(pinVal)}" aria-label="PIN del juego"><button class="btn" id="go">Entrar</button>${err ? `<div class="err">${esc(err)}</div>` : ''}</div>
    <button class="link" id="tch">¿Eres el docente? Crear partida</button></div>`;
}

/* ---------- equipo ---------- */
function team() {
  if (!st) return '<div class="center"><p class="wait emoji">☕</p></div>';
  const me = st.teams[ses.team], c = st.current, mine = lastRes()[ses.team];
  const pos = sorted().findIndex(([k]) => k === ses.team);
  const top = `<div class="top"><span>☕ ${esc(me.name)}</span>${exitBtn()}<span>Ronda ${Math.min(st.round + 1, st.total)}/${st.total}</span><span class="cap">${M(me.cap)}</span></div>`;
  if (st.phase === 'lobby') return `<div class="center">${exitBtn()}<div class="emoji wait">☕</div><h2 class="logo">¡Estás dentro!</h2><p class="tag">${esc(me.name)}<br>Mira la pantalla principal</p></div>`;
  if (me.bankrupt && st.phase !== 'decide') return `<div class="res dead">${exitBtn()}<div class="emoji">💀</div><h2>Tu empresa quebró</h2><p>Sigue la partida en el proyector.</p></div>`;
  if (st.phase === 'decide') {
    if (me.bankrupt) return `<div class="res dead"><div class="emoji">💀</div><h2>Tu empresa quebró</h2>${exitBtn()}</div>`;
    return `${top}<div class="q" style="margin:12px 12px 0"><h2 style="font-size:1.1rem;margin:0">${esc(c.title)}</h2></div>
      <div class="qrow" style="padding:10px 16px"><span class="pill tm"></span><span>${me.pick ? '✔ Decisión enviada' : 'Elige una opción'}</span></div>
      <div class="blks">${c.options.map((o) => `<button class="blk ${o.letter} ${me.pick && me.pick !== o.letter ? 'dim' : ''} ${me.pick === o.letter ? 'sel' : ''}" data-l="${o.letter}"><span class="sh">${SH[o.letter]}</span><span>${esc(o.text)}</span></button>`).join('')}</div>
      <p class="hint">${me.pick ? 'Puedes cambiarla hasta que se acabe el tiempo' : 'Lee la historia en la pantalla principal'}</p>`;
  }
  if (st.phase === 'final') return `<div class="res ${pos === 0 && me.cap > 0 ? 'big' : 'none'}"><div class="emoji">${pos === 0 ? '🏆' : pos === 1 ? '🥈' : '🥉'}</div><h2>${ORD[pos]} lugar</h2><div class="amt">${M(me.cap)}</div><p>${esc(me.name)}</p>${exitBtn()}</div>`;
  const k = mine?.kind || 'none';
  return `<div class="res ${k}"><div class="emoji">${KIND[k][1]}</div><h2>${KIND[k][0]}</h2>${mine ? `<div class="amt">${SG(mine.amount)}</div>` : ''}
    <p>Capital: <b>${M(me.cap)}</b> · Van <b>${ORD[pos]}</b></p>${c ? `<div class="why">${esc(c.options.find((o) => o.letter === mine?.letter)?.why || c.options.find((o) => o.kind === 'lose').why)}</div>` : ''}
    <p class="hint">Esperando la siguiente ronda…</p>${exitBtn()}</div>`;
}

/* ---------- docente ---------- */
function rankHtml() {
  const top = Math.max(1000, ...Object.values(st.teams).map((t) => t.cap));
  const res = lastRes();
  return `<div class="rank">${sorted().map(([k, t]) => `<div class="rk ${t.bankrupt || !t.claimed ? 'dead' : ''}"><b>☕ ${esc(t.name)}${t.bankrupt ? ' 💀' : ''}</b>
    <div class="bar"><i style="width:${Math.max(0, t.cap) / top * 100}%"></i><span>${M(t.cap)}${res[k] ? `<span class="d">${SG(res[k].amount)}</span>` : ''}</span></div></div>`).join('')}</div>`;
}

function podium() {
  const s = sorted(), order = [1, 0, 2].filter((i) => s[i]);
  return `<div class="center"><h2 class="logo">${s[0][1].cap > 0 ? '🏆 ' + esc(s[0][1].name) : '💀 Nadie sobrevivió'}</h2>
    <div class="pod">${order.map((i) => `<div class="p${i + 1} ${s[i][1].bankrupt ? 'dead' : ''}"><span>${esc(s[i][1].name)}<br>${M(s[i][1].cap)}</span><div class="st">${i + 1}</div></div>`).join('')}</div>
    <button class="btn light" id="new">Nueva partida</button></div>`;
}

function host() {
  if (!st) return '<div class="center"><p class="wait emoji">☕</p></div>';
  const c = st.current, alive = Object.values(st.teams).filter((t) => !t.bankrupt && t.claimed);
  if (st.phase === 'lobby') {
    const n = Object.values(st.teams).filter((t) => t.claimed).length;
    return `<div class="pinbar">Entra a <b>${esc(location.host)}</b> con el PIN<div class="n">${esc(ses.room)}</div></div>
      <div class="center">${exitBtn()}<div class="chips">${TEAMS.map(([k, name]) => `<div class="chip ${st.teams[k].claimed ? '' : 'off'}">☕ ${name}</div>`).join('')}</div>
      <p class="tag">${n}/3 equipos conectados</p><button class="btn light" data-h="start" ${n ? '' : 'disabled'}>Comenzar</button>${err ? `<div class="err">${esc(err)}</div>` : ''}</div>`;
  }
  const head = `<div class="top"><span>PIN <b>${esc(ses.room)}</b></span><span>Ronda ${st.round + 1}/${st.total}</span>${exitBtn()}</div>`;
  if (st.phase === 'decide') {
    const done = alive.filter((t) => t.decided).length;
    return `${head}<div class="q"><h2>${esc(c.title)}</h2><p>${esc(c.story)}</p></div>
      <div class="qrow"><div class="big-tm tm"></div><div class="cnt">${done}/${alive.length}<small>decisiones</small></div><button class="btn light" data-h="reveal">Revelar ya</button></div>
      <div class="blks host">${blocks(c.options.map((o) => ({ letter: o.letter, text: o.text })))}</div>`;
  }
  if (hv === 'podium') return podium();
  const final = st.phase === 'final';
  if (hv === 'rank') return `${head}<h2 class="logo" style="margin-top:14px">Ranking</h2>${rankHtml()}<div class="act"><button class="btn light" data-h="next">Siguiente ronda →</button></div>`;
  return `${head}<div class="q"><h2>${esc(c.title)}: resultados</h2></div><div class="blks host">${blocks(c.options)}</div>
    <div class="act"><button class="btn light" id="adv">${final ? 'Ver podio 🏆' : 'Ver ranking'}</button></div>`;
}

/* ---------- render ---------- */
function render() {
  const html = !ses ? home() : ses.role === 'host' ? host() : team();
  if (html === lastKey) return;
  lastKey = html;
  app.innerHTML = html;
  bind();
  tick();
  if (confetti && ((ses?.role === 'host' && hv === 'podium') || (ses?.role === 'team' && st?.phase === 'final'))) { confetti = false; burst(); }
}

function tick() {
  if (!st || st.phase !== 'decide') return;
  const s = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
  document.querySelectorAll('.tm').forEach((e) => { e.textContent = s; e.classList.toggle('low', s <= 10); });
}
setInterval(tick, 250);

function burst() {
  const cols = ['#e21b3c', '#1368ce', '#d89e00', '#26890c', '#fff'];
  for (let i = 0; i < 70; i++) {
    const d = document.createElement('i');
    d.className = 'conf';
    d.style.cssText = `left:${Math.random() * 100}vw;background:${cols[i % 5]};animation-duration:${2 + Math.random() * 2.5}s;animation-delay:${Math.random() * 1.2}s`;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 6500);
  }
}

function bind() {
  const pin = $('#pin');
  pin?.addEventListener('input', () => { pinVal = pin.value; });
  pin?.addEventListener('keydown', (e) => { if (e.key === 'Enter') ($('#go') || $('#mk')).click(); });
  $('#tch')?.addEventListener('click', () => { mode = 'teacher'; pinVal = ''; err = ''; render(); });
  $('#stu')?.addEventListener('click', () => { mode = 'student'; pinVal = ''; err = ''; render(); });
  $('#back')?.addEventListener('click', () => { pend = null; err = ''; render(); });
  $('#mk')?.addEventListener('click', async () => {
    try { const j = await api({ action: 'create', pin: pinVal }); ses = { room: j.room, role: 'host', token: j.hostToken }; err = ''; pinVal = ''; save(); poll(); } catch (e) { fail(e); }
  });
  $('#go')?.addEventListener('click', async () => {
    const room = pinVal.trim().toUpperCase();
    try {
      const r = await fetch('/api/game?room=' + encodeURIComponent(room));
      if (!r.ok) throw new Error('No encontramos esa partida. Revisa el PIN.');
      pend = { room, teams: (await r.json()).teams }; err = ''; render();
    } catch (e) { fail(e); }
  });
  document.querySelectorAll('[data-t]').forEach((b) => b.addEventListener('click', async () => {
    try {
      const j = await api({ action: 'join', room: pend.room, team: b.dataset.t });
      ses = { room: pend.room, role: 'team', team: b.dataset.t, token: j.token }; pend = null; err = ''; save(); poll();
    } catch (e) { fail(e); }
  }));
  document.querySelectorAll('[data-h]').forEach((b) => b.addEventListener('click', () => hostAct(b.dataset.h)));
  document.querySelectorAll('.blk[data-l]').forEach((b) => b.addEventListener('click', async () => {
    try { await api({ action: 'choose', room: ses.room, team: ses.team, token: ses.token, letter: b.dataset.l }); err = ''; poll(); } catch (e) { fail(e); }
  }));
  $('#adv')?.addEventListener('click', () => { hv = st.phase === 'final' ? 'podium' : 'rank'; if (hv === 'podium') confetti = true; render(); });
  $('#new')?.addEventListener('click', leave);
  $('#exit')?.addEventListener('click', () => {
    if (arm) { arm = false; return leave(); }
    arm = true; render(); setTimeout(() => { arm = false; render(); }, 3500);
  });
}

render();
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
